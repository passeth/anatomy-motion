  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (sel) => Array.from(document.querySelectorAll(sel));
      // film seconds; each entrance lands on the narration word it shows
      const exitAt = (sel, t) => tl.fromTo(q(sel + " .ln"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in", stagger: 0.04, immediateRender: false }, t);

        tl.fromTo(ln.querySelectorAll(".w"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.067 }, t0 + 0.03);

      lineBlur(q("#cap-arm .ln")[0], 8.3);
      lineBlur(q("#cap-arm .ln")[1], 9.2);
      window.__timelines["lines"] = tl;
    })();
